<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculando Resultado...</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <style>
    body {
      justify-content: center;
      align-items: center;
      gap: 1.5rem;
      padding: 1.5rem;
    }

    /* ── Card de carregamento ── */
    .anim-card {
      background: rgba(15,23,42,.97);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 2rem 2.5rem;
      text-align: center;
      max-width: 320px;
      width: 100%;
    }

    .anim-card img {
      max-width: 180px;
      width: 100%;
      height: auto;
      border-radius: 10px;
      margin-bottom: 1rem;
      filter: drop-shadow(0 4px 16px rgba(0,0,0,.4));
    }

    .anim-card h2 {
      font-family: var(--font-head);
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: .5rem;
    }

    /* Barra de loading pulsante */
    .loading-bar {
      width: 100%;
      height: 4px;
      background: var(--surface2);
      border-radius: 99px;
      overflow: hidden;
      margin-top: .75rem;
    }
    .loading-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 99px;
      animation: load 3s linear forwards;
    }
    @keyframes load { from { width: 0% } to { width: 100% } }

    /* Pontos animados */
    .dots span {
      display: inline-block;
      animation: bounce .8s infinite;
      color: var(--accent);
      font-size: 1.4rem;
    }
    .dots span:nth-child(2) { animation-delay: .15s; }
    .dots span:nth-child(3) { animation-delay: .30s; }
    @keyframes bounce { 0%,80%,100%{transform:translateY(0)} 40%{transform:translateY(-6px)} }

    /* ── Imagem da equipe ── */
    .team-img {
      max-width: 820px;
      width: 100%;
    }
    .team-img img {
      width: 100%;
      height: auto;
      border-radius: 14px;
      box-shadow: var(--shadow);
    }
  </style>
</head>
<body>

  <div class="anim-card">
    {% if modo == 'piscicultura' %}
      <img src="{{ url_for('static', filename='img/fish_placar.gif') }}" alt="Calculando...">
    {% else %}
      <img src="{{ url_for('static', filename='img/vaquinha.gif') }}" alt="Calculando...">
    {% endif %}

    <h2>Calculando sua pontuação<span class="dots"><span>.</span><span>.</span><span>.</span></span></h2>

    <div class="loading-bar">
      <div class="loading-fill"></div>
    </div>
  </div>

  <div class="team-img">
    <img src="{{ url_for('static', filename='img/perfilado(2).png') }}" alt="Equipe">
  </div>

  <script>
    setTimeout(function() {
      window.location.href = "{{ url_for('resultado') }}";
    }, 3000);
  </script>
</body>
</html>
