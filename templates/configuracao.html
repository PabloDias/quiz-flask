<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Configurações — Quiz SAGRIMA</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <style>
    body {
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
    }

    .config-card {
      background: rgba(15,23,42,.97);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 2rem;
      max-width: 480px;
      width: 100%;
    }

    .config-title {
      font-family: var(--font-head);
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--text);
      text-align: center;
      margin-bottom: 1.5rem;
    }

    /* Seção */
    .config-section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.2rem;
      margin-bottom: 1rem;
    }
    .config-section h2 {
      font-family: var(--font-head);
      font-size: .85rem;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 1rem;
    }

    /* Form group */
    .form-group {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: .75rem;
    }
    .form-group label {
      color: var(--text);
      font-size: .95rem;
      font-weight: 500;
    }
    .form-group input[type="number"] {
      width: 90px;
      text-align: center;
      font-size: 1.1rem;
      font-weight: 700;
      flex-shrink: 0;
    }
    .form-group select {
      flex: 1;
      font-size: .9rem;
    }

    /* Divisor */
    hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 1.2rem 0;
    }

    /* Botões */
    .btn-row {
      display: flex;
      gap: .6rem;
      flex-wrap: wrap;
    }
    .btn-salvar { background: var(--green);  color: #fff; }
    .btn-limpar { background: var(--red);    color: #fff; }
    .btn-voltar { background: var(--surface2); color: var(--muted); text-decoration: none; }

    /* Confirm inline */
    .confirm-msg {
      font-size: .78rem;
      color: var(--muted);
      margin-top: .5rem;
    }
  </style>
</head>
<body>

  <div class="config-card">
    <h1 class="config-title">⚙ Configurações</h1>

    <!-- ── Perguntas por partida ── -->
    <div class="config-section">
      <h2>Partida</h2>
      <form action="{{ url_for('salvar_configuracao') }}" method="post">
        <div class="form-group">
          <label for="num_perguntas">Perguntas por partida</label>
          <input type="number" id="num_perguntas" name="num_perguntas"
                 value="{{ config.get('perguntas_por_partida', 5) }}" min="1" max="50">
        </div>
        <div class="btn-row">
          <button type="submit" class="btn btn-salvar">💾 Salvar</button>
        </div>
      </form>
    </div>

    <!-- ── Limpar placar ── -->
    <div class="config-section">
      <h2>Limpar Placar</h2>
      <form action="{{ url_for('limpar_placar') }}" method="post"
            onsubmit="return confirm('Tem certeza? Esta ação não pode ser desfeita.')">
        <div class="form-group">
          <label for="modo_para_limpar">Modo</label>
          <select name="modo_para_limpar" id="modo_para_limpar">
            <option value="classico">⚡ Clássico</option>
            <option value="aprendizagem">🌱 Aprendizagem</option>
            <option value="piscicultura">🐟 Piscicultura</option>
          </select>
        </div>
        <div class="btn-row">
          <button type="submit" class="btn btn-limpar">🗑 Limpar Placar</button>
        </div>
        <p class="confirm-msg">Uma confirmação será solicitada antes de limpar.</p>
      </form>
    </div>

    <!-- ── Voltar ── -->
    <a href="{{ url_for('home') }}" class="btn btn-voltar" style="display:block;text-align:center;padding:.85rem;">
      ← Voltar ao Início
    </a>
  </div>

</body>
</html>
